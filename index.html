<!DOCTYPE html>
<html lang="ja">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>天気のたね</title>
  <!-- ?v=N はキャッシュ対策。style.css/script.js を編集したら両方の番号を1つ上げる -->
  <link rel="stylesheet" href="./style.css?v=24">
</head>
<body>
  <h1 class="app-title">天気のたね</h1>
  <p class="app-subtitle">この空気は、どのくらい上げると雲ができるだろう？</p>
  <div class="toolbar">
    <button id="tutorial-replay" class="tutorial-replay" type="button"></button>
  </div>
  <main class="app-layout">
    <!-- 「読む」計器（温度・水蒸気ゲージ）はマップの中、「触る」距離レバーはマップの
         外・横向きに置く。場所・向き・色の3つで区別をつけ、凡例に頼らずに済ませる
         （design.md「UIの課題」参照。弟さんの「バーが二つあるのはなぜ?」への対応） -->
    <svg id="map" viewBox="0 0 400 320" xmlns="http://www.w3.org/2000/svg" aria-label="山と空気の塊、高さ・気温の情報パネル、水蒸気ゲージ">
      <!-- 空（雲＝○の白いfillが背景と見分けられるよう、薄い青系の色を敷く） -->
      <rect class="sky" x="0" y="0" width="400" height="320" />

      <!-- 地面 -->
      <rect class="land" x="0" y="280" width="400" height="10" />

      <!-- 山（山への接近判定にもこの図形をそのまま使う） -->
      <g class="mountains">
        <polygon points="150,280 280,280 215,120" />
      </g>

      <!-- 空気の塊 -->
      <circle id="air-mass" cx="60" cy="250" r="22" />

      <!-- 上昇エフェクト（高さが上がった瞬間だけ、山と同じ△の形でフワッと浮かぶ） -->
      <g class="lift-arrows">
        <polygon class="lift-arrow" points="0,0 0,0 0,0" />
        <polygon class="lift-arrow" points="0,0 0,0 0,0" />
        <polygon class="lift-arrow" points="0,0 0,0 0,0" />
      </g>

      <!-- 情報パネル（高さ・気温）。気温は「上げると冷える」の途中経過であって
           生徒が読み取るべき最終出力ではないため、数値＋短い横帯に留める -->
      <g class="info-panel" transform="translate(8,8)">
        <rect class="panel-plate" x="0" y="0" width="180" height="42" rx="6" />
        <text class="readout" x="10" y="16">高さ <tspan id="height-value">0</tspan> / 100</text>
        <text class="readout" x="10" y="33">気温 <tspan id="temp-value">15.0</tspan>℃</text>
        <rect class="temp-strip-bg" x="96" y="24" width="76" height="10" rx="5" />
        <rect id="temp-strip-fill" class="temp-strip-fill" x="96" y="24" width="0" height="10" rx="5" />
      </g>

      <!-- 水蒸気ゲージ（主役、反転済み）: 塗り＝保有水蒸気量（9.4固定・動かない）、
           点線＝飽和水蒸気量（気温が下がると降りてくる）。点線が塗りより下に来た分を
           白抜き＋輪郭線で示す（○が白く曇る雲の表現と同じ視覚言語。design.md参照） -->
      <g class="vapor-panel" transform="translate(296,20)">
        <rect class="panel-plate" x="-10" y="-20" width="96" height="270" rx="6" />
        <text class="gauge-label" x="26" y="-6">水蒸気</text>
        <rect class="gauge-track" x="0" y="0" width="52" height="210" />
        <rect id="vapor-fill" class="gauge-fill" x="0" y="0" width="52" height="0" />
        <rect id="vapor-excess-band" class="excess-band" x="0" y="0" width="52" height="0" />
        <line id="vapor-cap-line" class="vapor-cap-line" x1="-8" x2="60" y1="0" y2="0" />
        <text id="vapor-cap-label" class="readout-small" x="64" y="0">上限</text>
        <text class="readout-small" x="-6" y="228">あふれ</text>
        <text class="readout-strong" x="-6" y="246"><tspan id="excess-value">0.0</tspan> g/m³</text>
      </g>
    </svg>

    <!-- 距離レバー: マップ外・横向き・全幅。左＝遠い、右＝山に近い、で指の動きと
         ○の動く向きを一致させる（従来の縦向きは「指は上、○は右」という不一致があった） -->
    <div class="levers">
      <p id="distance-lever-caption" class="lever-caption"></p>
      <svg id="distance-lever" class="lever-svg" viewBox="0 0 400 40" xmlns="http://www.w3.org/2000/svg" aria-label="距離レバー">
        <rect class="gauge-track" x="4" y="13" width="392" height="14" rx="7" />
        <rect id="distance-lever-fill" class="gauge-fill" x="4" y="13" width="0" height="14" rx="7" />
        <circle id="distance-lever-handle" class="lever-handle" cx="4" cy="20" r="14" />
      </svg>
    </div>

    <!-- 季節スライダーの将来枠（今回は未実装）。距離レバーと同じ「横向き・マップ外」の
         系統として直下に確保しておく（design.md「季節スライダー」参照） -->
    <div class="season-slot">
      <p class="lever-caption">季節スライダー（準備中）</p>
      <svg class="season-track-h" viewBox="0 0 400 26" xmlns="http://www.w3.org/2000/svg" aria-hidden="true">
        <rect class="season-placeholder" x="4" y="6" width="392" height="14" rx="7" />
      </svg>
    </div>
  </main>

  <div id="change-log" class="change-log">
    <p class="change-log-title">変化ログ</p>
    <ul id="change-log-list"></ul>
  </div>

  <div id="legend" class="legend"></div>

  <!-- チュートリアル（初回起動時のみ、JS側でlocalStorageを見て表示制御） -->
  <div id="tutorial-overlay" class="tutorial-overlay" hidden>
    <div id="tutorial-bubble" class="tutorial-bubble">
      <p id="tutorial-step-label" class="tutorial-step-label"></p>
      <p id="tutorial-text"></p>
      <div class="tutorial-actions">
        <button id="tutorial-skip" type="button" class="tutorial-skip"></button>
        <button id="tutorial-next" type="button" class="tutorial-next"></button>
      </div>
    </div>
  </div>

  <script src="./script.js?v=24"></script>
</body>
</html>
