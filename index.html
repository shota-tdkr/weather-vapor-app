<!DOCTYPE html>
<html lang="ja">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>雲のたね</title>
  <!-- ?v=N はキャッシュ対策。style.css/script.js を編集したら両方の番号を1つ上げる -->
  <link rel="stylesheet" href="./style.css?v=42">
</head>
<body>
  <h1 class="app-title">雲のたね</h1>
  <!-- サブタイトルは「何をするアプリか」を常時伝える一行（お題の問題文が独立したため
       旧「この空気は…だろう？」の問いかけはここでは不要になった）。お題モード中は
       スマホで非表示になる（style.css の body.quiz-mode 参照） -->
  <p class="app-subtitle">予想して、空気を山に近づけて、雲ができる瞬間を見つけよう。</p>
  <!-- 「お題に挑戦」がこのアプリの主要体験なので、先頭＋塗りつぶし（既存の濃紺）。
       「使い方を見る」は補助なので枠線のみ -->
  <div class="toolbar">
    <button id="quiz-start-button" class="quiz-start-button" type="button"></button>
    <button id="tutorial-replay" class="tutorial-replay" type="button"></button>
  </div>

  <!-- お題モード: 「レバーを動かすだけ」という弟さんの反応を受けて追加。予想してから
       確かめる形式にすることで、レバー操作に理由と結果を与える。タイトル画面は作らず、
       常時表示のボタンから始める（開いた瞬間に触れる状態を維持するため。design.md
       「お題モード」参照） -->
  <div id="quiz-panel" class="quiz-panel" hidden>
    <div class="quiz-header">
      <p id="quiz-progress" class="quiz-progress"></p>
      <button id="quiz-exit-button" class="quiz-exit-button" type="button"></button>
    </div>
    <p id="quiz-question" class="quiz-question"></p>
    <div id="quiz-choices" class="quiz-choices"></div>
    <p id="quiz-hint" class="quiz-hint"></p>
    <div id="quiz-reveal" class="quiz-reveal" hidden>
      <p id="quiz-your-guess" class="quiz-your-guess"></p>
      <p id="quiz-reveal-text" class="quiz-reveal-text"></p>
      <button id="quiz-next-button" class="quiz-next-button" type="button"></button>
    </div>
  </div>

  <div id="quiz-summary" class="quiz-summary" hidden>
    <p id="quiz-summary-title" class="quiz-summary-title"></p>
    <div id="quiz-summary-table-wrap" class="quiz-summary-table-wrap"></div>
    <p id="quiz-summary-conclusion" class="quiz-summary-conclusion"></p>
    <!-- 学校で使う正式用語（飽和水蒸気量）への橋渡し。まとめの一番下に、破線で
         区切って「授業に持ち帰る一言」として置く -->
    <p id="quiz-summary-term" class="quiz-summary-term"></p>
    <div class="quiz-summary-actions">
      <button id="quiz-restart-button" class="quiz-restart-button" type="button"></button>
      <button id="quiz-summary-exit-button" class="quiz-exit-button" type="button"></button>
    </div>
  </div>

  <main class="app-layout">
    <!-- 「読む」計器（温度・水蒸気ゲージ）はマップの中、「触る」レバー（距離・水蒸気の量）
         はマップの外・横向きに置く。場所・向き・色の3つで区別をつけ、凡例に頼らずに
         済ませる（design.md「UIの課題」参照。弟さんの「バーが二つあるのはなぜ?」への対応） -->
    <svg id="map" viewBox="0 0 400 320" xmlns="http://www.w3.org/2000/svg" aria-label="山と空気の塊、高さ・気温の情報パネル、水蒸気ゲージ">
      <defs>
        <!-- 「この気温ではもう入らない量」を示す斜線。新しい色は足さず、濃紺
             (#1c2541)を薄く敷くだけ。塗りつぶしにせず斜線にするのは、ゲージの
             塗り（＝今の量）や白抜き（＝水滴）と質感で区別するため -->
        <pattern id="no-room-hatch" width="6" height="6" patternUnits="userSpaceOnUse" patternTransform="rotate(45)">
          <line x1="0" y1="0" x2="0" y2="6" stroke="#1c2541" stroke-width="1.5" stroke-opacity="0.22" />
        </pattern>
      </defs>

      <!-- 空（雲＝○の白いfillが背景と見分けられるよう、薄い青系の色を敷く） -->
      <rect class="sky" x="0" y="0" width="400" height="320" />

      <!-- 地面 -->
      <rect class="land" x="0" y="280" width="400" height="10" />

      <!-- 山（山への接近判定にもこの図形をそのまま使う） -->
      <g class="mountains">
        <polygon points="150,280 280,280 215,120" />
      </g>

      <!-- 空気の塊。○(air-mass-base)は雲ができても消えず常にそのまま残る
           （理科的にも、空気塊が消えて雲になるわけではなく、その中の水蒸気の
           一部が水滴になって雲を作るため）。あふれ量が0より大きくなったら、
           ○の上に雲(air-mass-cloud、1本のpath)が現れ、あふれ量に応じて
           段階的に大きく育っていく（design.md参照）。位置は#air-massグループの
           transformで○・雲まとめて動かす。data-far-x/yは距離レバーが最大
           （山から最も遠い）ときの初期配置 -->
      <g id="air-mass" data-far-x="60" data-far-y="250">
        <circle id="air-mass-base" cx="0" cy="0" r="22" />
        <path id="air-mass-cloud" transform="translate(0,-10)" opacity="0" />
      </g>

      <!-- 上昇エフェクト（高さが上がった瞬間だけ、山と同じ△の形でフワッと浮かぶ） -->
      <g class="lift-arrows">
        <polygon class="lift-arrow" points="0,0 0,0 0,0" />
        <polygon class="lift-arrow" points="0,0 0,0 0,0" />
        <polygon class="lift-arrow" points="0,0 0,0 0,0" />
      </g>

      <!-- 情報パネル（高さ・気温）。気温は「上げると冷える」の途中経過であって
           生徒が読み取るべき最終出力ではないため、数値＋短い横帯に留める。
           高さの「0 / 100」は意図的な相対値（実単位を名乗ると気温減率などの簡略化
           モデルと現実の齟齬が問われるため。design.md参照）。中学生が「25m?」と
           誤読しないよう、実際のmではない旨を1行添える -->
      <g class="info-panel" transform="translate(8,8)">
        <rect class="panel-plate" x="0" y="0" width="180" height="52" rx="6" />
        <text class="readout-sub" x="10" y="15">高さ <tspan id="height-value">0</tspan> / 100</text>
        <text class="readout-note" x="10" y="27">※実際の高さ（m）ではありません</text>
        <text class="readout-sub" x="10" y="43">気温 <tspan id="temp-value">15</tspan>℃</text>
        <rect class="temp-strip-bg" x="96" y="34" width="76" height="10" rx="5" />
        <rect id="temp-strip-fill" class="temp-strip-fill" x="96" y="34" width="0" height="10" rx="5" />
      </g>

      <!-- 水蒸気ゲージ（主役、反転済み）: 塗り＝水蒸気の量（高さを変えても動かないが、
           下の水蒸気の量スライダーで4段階に切り替えられる）、点線＝飽和水蒸気量
           （気温が下がると降りてくる）。点線が塗りより下に来た分を白抜き＋輪郭線で
           示す（○が白く曇る雲の表現と同じ視覚言語。design.md参照） -->
      <g class="vapor-panel" transform="translate(296,20)">
        <rect class="panel-plate" x="-12" y="-20" width="112" height="270" rx="6" />
        <!-- 見出し「水蒸気の量」の下に、段階のラベル＋数値をまとめて出す
             （例「やや多い（9.4 g/m³）」）。スライダー側にラベル・ここに数値、と
             分離していたため「やや多い＝9.4」の対応が読めなかったのを解消。
             お題モードで予想の根拠になる。JSがrenderVaporLevelControlで更新する。
             この2行分の縦スペースを空けるため、下のトラックの開始を y=14 に下げている
             （script.jsのVAPOR_TRACK_TOP=14と一致） -->
        <text class="gauge-label" x="-6" y="-8">水蒸気の量</text>
        <text class="held-vapor-readout" id="held-vapor-value" x="-8" y="6"></text>
        <rect class="gauge-track" x="0" y="14" width="52" height="196" />
        <!-- 「もう入らない領域」= 点線（上限）より上。気温が下がると点線が降りてきて
             この斜線が上から広がる＝入る場所が減っていくことが、数字を読まなくても
             分かる。塗り(#vapor-fill)より先に描き、下に敷く（塗りと重なる部分は
             水滴になった分＝白抜きの#vapor-excess-bandが上に出る） -->
        <rect id="vapor-no-room" class="no-room-band" x="0" y="0" width="52" height="0" />
        <rect id="vapor-fill" class="gauge-fill" x="0" y="0" width="52" height="0" />
        <rect id="vapor-excess-band" class="excess-band" x="0" y="0" width="52" height="0" />
        <line id="vapor-cap-line" class="vapor-cap-line" x1="-8" x2="60" y1="0" y2="0" />
        <text id="vapor-cap-label" class="readout-small" x="64" y="0">上限</text>
        <!-- 水滴になった量。0のときは「0.0 g/m³」を出しても情報がないので、見出しごと
             隠す（JSがopacityを切り替える）。雲ができた瞬間に数字が現れること自体が
             合図になる -->
        <g id="excess-readout">
          <text class="readout-small" x="-6" y="228">水滴になった量</text>
          <text class="readout-strong" x="-6" y="246"><tspan id="excess-value">0.0</tspan> g/m³</text>
        </g>
      </g>

      <!-- 雲ができた瞬間だけ数秒出す一行。アプリで最良の瞬間（余裕があった状態から
           急にあふれ始める瞬間）が0.3秒の雲の出現だけで流れてしまう、かつ変化ログが
           読まれない、という2つの指摘に1つの要素で応える（design.md参照）。
           位置は固定: 情報パネル(y≤60)の下、山の頂点(y=120)より上、ゲージ(x≥284)の左、
           という常に空いている帯。x=96中心なら山頂まで上げたときの雲(x≥185)とも
           重ならない。opacityはJSが出し入れするのでCSSに値を書かない -->
      <text id="cloud-flash" class="cloud-flash" x="96" y="80" opacity="0"></text>
    </svg>

    <!-- 距離レバー: マップ外・横向き・全幅。左＝遠い、右＝山に近い、で指の動きと
         ○の動く向きを一致させる（従来の縦向きは「指は上、○は右」という不一致があった） -->
    <div class="levers" id="distance-lever-panel">
      <p id="distance-lever-caption" class="lever-caption"></p>
      <svg id="distance-lever" class="lever-svg" viewBox="0 0 400 40" xmlns="http://www.w3.org/2000/svg" aria-label="距離レバー">
        <rect class="gauge-track" x="4" y="13" width="392" height="14" rx="7" />
        <rect id="distance-lever-fill" class="gauge-fill" x="4" y="13" width="0" height="14" rx="7" />
        <circle id="distance-lever-handle" class="lever-handle" cx="4" cy="20" r="14" />
      </svg>
    </div>

    <!-- 水蒸気の量スライダー: 距離レバーと同じ「触るもの」の系統（マップ外・横向き・
         全幅）で直下に配置する。4段階で、教科書の対応表の値をそのまま水蒸気の量として
         使う（design.md「水蒸気の量スライダー」参照） -->
    <div class="levers" id="vapor-level-panel">
      <p id="vapor-level-caption" class="lever-caption"></p>
      <svg id="vapor-level-lever" class="lever-svg" viewBox="0 0 400 40" xmlns="http://www.w3.org/2000/svg" aria-label="水蒸気の量スライダー">
        <rect class="gauge-track" x="4" y="13" width="392" height="14" rx="7" />
        <rect id="vapor-level-fill" class="gauge-fill" x="4" y="13" width="0" height="14" rx="7" />
        <line class="vapor-level-tick" x1="4" y1="8" x2="4" y2="25" />
        <line class="vapor-level-tick" x1="134.67" y1="8" x2="134.67" y2="25" />
        <line class="vapor-level-tick" x1="265.33" y1="8" x2="265.33" y2="25" />
        <line class="vapor-level-tick" x1="396" y1="8" x2="396" y2="25" />
        <circle id="vapor-level-handle" class="lever-handle" cx="4" cy="20" r="14" />
      </svg>
      <!-- 数値(g/m³)はマップ内のゲージ横に1箇所だけ置く。ここに再掲すると同じ数字が
           画面に2度出る（お題モードでは問題文と合わせて3度）。「同じ数字を2回描いて
           いるだけで情報を持たない」＝コップを撤去したときの判断基準に揃える。
           段階のラベル（やや多い等）はスライダーの現在位置を言葉で示す情報なので残す -->
      <p class="vapor-level-readout">現在: <span id="vapor-level-label"></span></p>
    </div>
  </main>

  <div id="change-log" class="change-log">
    <p class="change-log-title">変化ログ</p>
    <ul id="change-log-list"></ul>
  </div>

  <div id="legend" class="legend"></div>

  <!-- チュートリアル（初回起動時のみ、JS側でlocalStorageを見て表示制御） -->
  <div id="tutorial-overlay" class="tutorial-overlay" hidden>
    <div id="tutorial-bubble" class="tutorial-bubble">
      <p id="tutorial-step-label" class="tutorial-step-label"></p>
      <p id="tutorial-text"></p>
      <div class="tutorial-actions">
        <button id="tutorial-skip" type="button" class="tutorial-skip"></button>
        <button id="tutorial-next" type="button" class="tutorial-next"></button>
      </div>
    </div>
  </div>

  <script src="./script.js?v=42"></script>
</body>
</html>
