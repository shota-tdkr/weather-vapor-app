<!DOCTYPE html>
<html lang="ja">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>天気をつくるアプリ</title>
  <link rel="stylesheet" href="./style.css">
</head>
<body>
  <div class="toolbar">
    <button id="mode-toggle" class="mode-toggle" type="button">実験モードにする</button>
    <p>現在のモード: <span id="mode-label">通常モード</span></p>
    <p>高さ: <span id="height-value">0</span> / 100</p>
  </div>
  <main class="app-layout">
    <svg id="map" viewBox="0 0 570 480" xmlns="http://www.w3.org/2000/svg" aria-label="日本地図">
      <!-- 陸地（県境なし、簡略化。海岸線はNatural Earth（パブリックドメイン）の座標を基に作成） -->
      <polygon class="land" points="497,65 518,71 540,58 546,92 502,100 476,130 428,110 412,142 379,143 375,113 389,90 421,88 430,47 439,23 474,55" />
      <polygon class="land" points="137,348 159,327 218,318 250,324 282,271 302,285 346,255 363,244 382,207 377,173 389,154 421,149 437,190 437,215 409,245 409,276 398,300 403,315 388,336 349,350 297,352 254,386 234,375 232,352 180,359 145,373 110,373" />
      <polygon class="land" points="219,366 223,376 206,394 194,384 178,391 170,409 151,400 151,386 168,368 185,372 197,359" />
      <polygon class="land" points="140,396 120,446 101,459 86,447 93,420 74,412 62,391 91,382 106,363" />

      <!-- 山脈（記号で表示） -->
      <g class="mountains">
        <polygon points="464,107 456,122 472,122" />
        <polygon points="404,185 396,200 412,200" />
        <polygon points="389,233 381,248 397,248" />
        <polygon points="344,278 336,293 352,293" />
        <polygon points="311,293 303,308 319,308" />
        <polygon points="326,317 318,332 334,332" />
        <polygon points="257,362 249,377 265,377" />
        <polygon points="170,332 162,347 178,347" />
        <polygon points="116,392 108,407 124,407" />
      </g>

      <!-- 空気の塊 -->
      <circle id="air-mass" cx="170" cy="220" r="22" />
    </svg>

    <div class="gauges">
      <div class="gauge">
        <svg class="thermometer" viewBox="0 0 40 280" xmlns="http://www.w3.org/2000/svg" aria-label="温度計">
          <rect class="gauge-track" x="12" y="20" width="16" height="208" rx="8" />
          <rect id="thermometer-fill" class="gauge-fill" x="12" y="228" width="16" height="0" rx="8" />
          <circle class="gauge-fill" cx="20" cy="248" r="20" />
        </svg>
        <p>温度: <span id="temp-value">5.0</span>℃</p>
      </div>

      <div class="gauge">
        <svg class="vapor-gauge" viewBox="0 0 60 280" xmlns="http://www.w3.org/2000/svg" aria-label="水蒸気ゲージ">
          <rect class="gauge-track" x="15" y="20" width="30" height="210" />
          <rect id="capacity-fill" class="gauge-fill" x="15" y="230" width="30" height="0" />
          <line id="held-marker" class="gauge-marker" x1="8" x2="52" y1="230" y2="230" />
        </svg>
        <p>保有水蒸気量: <span id="held-value">6.8</span> g/m³</p>
        <p>飽和水蒸気量: <span id="capacity-value">6.8</span> g/m³</p>
      </div>
    </div>
  </main>
  <div id="legend" class="legend"></div>
  <script src="./script.js"></script>
</body>
</html>
