<!DOCTYPE html>
<html lang="ja">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>天気をつくるアプリ</title>
  <!-- ?v=N はキャッシュ対策。style.css/script.js を編集したら両方の番号を1つ上げる -->
  <link rel="stylesheet" href="./style.css?v=3">
</head>
<body>
  <div class="toolbar">
    <button id="mode-toggle" class="mode-toggle" type="button">高さだけ動かせるようにする</button>
    <p>今: <span id="mode-label">○は地図で動かせます</span></p>
    <p>高さ: <span id="height-value">0</span> / 100</p>
  </div>
  <main class="app-layout">
    <svg id="map" viewBox="0 0 400 320" xmlns="http://www.w3.org/2000/svg" aria-label="山と空気の塊">
      <!-- 地面 -->
      <rect class="land" x="0" y="280" width="400" height="10" />

      <!-- 山（山への接近判定にもこの図形をそのまま使う） -->
      <g class="mountains">
        <polygon points="150,280 280,280 215,120" />
      </g>

      <!-- 空気の塊 -->
      <circle id="air-mass" cx="60" cy="250" r="22" />

      <!-- 上昇エフェクト（高さが上がった瞬間だけ、山と同じ△の形でフワッと浮かぶ） -->
      <g class="lift-arrows">
        <polygon class="lift-arrow" points="0,0 0,0 0,0" />
        <polygon class="lift-arrow" points="0,0 0,0 0,0" />
        <polygon class="lift-arrow" points="0,0 0,0 0,0" />
      </g>
    </svg>

    <div class="lever">
      <svg id="height-lever" class="height-lever" viewBox="0 0 40 280" xmlns="http://www.w3.org/2000/svg" aria-label="高さレバー（実験モードのみ操作できます）">
        <rect class="gauge-track" x="12" y="20" width="16" height="210" rx="8" />
        <rect id="lever-fill" class="gauge-fill" x="12" y="230" width="16" height="0" rx="8" />
        <circle id="lever-handle" class="lever-handle" cx="20" cy="230" r="13" />
      </svg>
      <p class="lever-caption">高さレバー<br>（実験モードのみ）</p>
    </div>

    <div class="gauges">
      <div class="gauge">
        <svg class="thermometer" viewBox="0 0 40 280" xmlns="http://www.w3.org/2000/svg" aria-label="温度計">
          <rect class="gauge-track" x="12" y="20" width="16" height="208" rx="8" />
          <rect id="thermometer-fill" class="gauge-fill" x="12" y="228" width="16" height="0" rx="8" />
          <circle class="gauge-fill" cx="20" cy="248" r="20" />
        </svg>
        <p>温度: <span id="temp-value">5.0</span>℃</p>
      </div>

      <div class="gauge">
        <svg class="vapor-gauge" viewBox="0 0 60 280" xmlns="http://www.w3.org/2000/svg" aria-label="水蒸気ゲージ">
          <rect class="gauge-track" x="15" y="20" width="30" height="210" />
          <rect id="capacity-fill" class="gauge-fill" x="15" y="230" width="30" height="0" />
          <line id="held-marker" class="gauge-marker" x1="8" x2="52" y1="230" y2="230" />
        </svg>
        <p>保有水蒸気量: <span id="held-value">6.8</span> g/m³</p>
        <p>飽和水蒸気量: <span id="capacity-value">6.8</span> g/m³</p>
      </div>
    </div>

    <div class="cup-panel">
      <svg class="cup" viewBox="0 0 100 140" xmlns="http://www.w3.org/2000/svg" aria-label="コップ（抱えきれなかった水蒸気が水滴になります）">
        <polygon class="cup-liquid" points="29,55 71,55 62,115 38,115" />
        <polygon class="cup-outline" points="25,25 75,25 62,115 38,115" />
        <!-- 液体（下側）に近い順に並べる。この並び順のままJS側で「あふれた量が少ないほど先に表示」する -->
        <circle class="droplet" cx="18" cy="102" r="4" />
        <circle class="droplet" cx="82" cy="105" r="4" />
        <circle class="droplet" cx="15" cy="85" r="4" />
        <circle class="droplet" cx="85" cy="90" r="4" />
        <circle class="droplet" cx="17" cy="65" r="4" />
        <circle class="droplet" cx="83" cy="70" r="4" />
        <circle class="droplet" cx="20" cy="45" r="4" />
        <circle class="droplet" cx="80" cy="50" r="4" />
      </svg>
      <p>コップについた水滴<br>（抱えきれなかった水蒸気量）</p>
    </div>
  </main>

  <div class="change-log">
    <p class="change-log-title">変化ログ</p>
    <ul id="change-log-list"></ul>
  </div>

  <div id="legend" class="legend"></div>
  <script src="./script.js?v=3"></script>
</body>
</html>
